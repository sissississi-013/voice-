# Scripts declare their own deps inline (PEP 723) and run with `uv run --no-project`.
# This file only configures dev tooling.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
extend-exclude = ["style_chat.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
